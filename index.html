<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Night Out Chicago</title>
  <meta name="description" content="One corridor. Eat → Then → Backup → Transit → Don’t. Pick a night and who you’re with." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="desk" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <span class="wordmark">Night Out</span>
      <span class="chip sun">Chicago</span>
    </div>
    <p class="promise">Eat → Then → Backup → Transit → Don’t</p>
  </header>

  <section class="calendar-bar" aria-label="Pick a night">
    <div class="cal-label">Night</div>
    <div class="cal-track" id="cal-track" role="tablist"></div>
    <div class="cal-slider" aria-hidden="true">
      <input id="cal-range" type="range" min="0" max="5" value="0" step="1" />
    </div>
  </section>

  <section class="party-bar" aria-label="Who you’re with">
    <div class="cal-label">With</div>
    <div class="party-track" id="party-track" role="tablist">
      <button type="button" role="tab" data-party="couple" aria-selected="true">Couple</button>
      <button type="button" role="tab" data-party="family" aria-selected="false">Family</button>
      <button type="button" role="tab" data-party="friends" aria-selected="false">Friends</button>
    </div>
    <div class="party-slider" aria-hidden="true">
      <input id="party-range" type="range" min="0" max="2" value="0" step="1" />
    </div>
  </section>

  <main id="stage"></main>

  <footer class="foot">
    <p>Living plans · <code>plans.json</code> · nightoutchicago.com</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
