<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Night Out Chicago — Snap a night</title>
  <meta name="description" content="Chicago nights in three swipes: what to eat, what to do, and a backup — filter by vibe, who you’re with, and the night." />
  <meta name="theme-color" content="#FF5A36" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="chrome">
    <div class="brand">
      <span class="wordmark">Night Out</span>
      <span class="chip">Chicago</span>
    </div>
    <p class="proof" id="proof">Loading nights…</p>
  </header>

  <nav class="toggles" aria-label="Filters">
    <div class="toggle-block">
      <span class="toggle-label">Vibe</span>
      <div class="pill-row wrap" id="cat-row" role="tablist"></div>
    </div>
    <div class="toggle-block">
      <span class="toggle-label">With</span>
      <div class="pill-row wrap" id="party-row" role="tablist">
        <button type="button" role="tab" data-party="couple" aria-selected="true">Couple</button>
        <button type="button" role="tab" data-party="family" aria-selected="false">Family</button>
        <button type="button" role="tab" data-party="friends" aria-selected="false">Friends</button>
      </div>
    </div>
    <div class="toggle-block" id="night-block" hidden>
      <span class="toggle-label">Night</span>
      <div class="pill-row wrap" id="night-row" role="tablist"></div>
    </div>
  </nav>

  <main id="deck" class="deck" aria-label="Night Out lanes" tabindex="0"></main>

  <script src="app.js"></script>
</body>
</html>
