<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Night Out Chicago — Neighborhoods → Eat → Then</title>
  <meta name="description" content="Browse Chicago by neighborhood, then lock a night: dinner, then something worth going out for." />
  <meta name="theme-color" content="#FF5A36" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="chrome">
    <div class="brand">
      <span class="wordmark">Night Out</span>
      <span class="chip">Chicago</span>
    </div>
    <p class="proof" id="proof">Checking the boards…</p>
  </header>

  <nav class="toggles" aria-label="Filters">
    <div class="toggle-block">
      <span class="toggle-label">Vibe</span>
      <div class="pill-row" id="cat-row" role="tablist"></div>
    </div>
    <div class="toggle-block">
      <span class="toggle-label">With</span>
      <div class="pill-row" id="party-row" role="tablist">
        <button type="button" role="tab" data-party="couple" aria-selected="true">Couple</button>
        <button type="button" role="tab" data-party="family" aria-selected="false">Family</button>
        <button type="button" role="tab" data-party="friends" aria-selected="false">Friends</button>
      </div>
    </div>
    <div class="toggle-block" id="night-block" hidden>
      <span class="toggle-label">Night</span>
      <div class="pill-row" id="night-row" role="tablist"></div>
    </div>
  </nav>

  <main id="app">
    <section class="slide open" id="open">
      <div class="media" style="background-image:url('https://images.unsplash.com/photo-1477959858617-67f85b6b1ce5?auto=format&fit=crop&w=1800&q=80')"></div>
      <div class="shade"></div>
      <div class="copy">
        <p class="eyebrow">Chicago first</p>
        <h1>What’s on<br />in the neighborhood.</h1>
        <p class="lede">Scroll the city. When you’re ready, lock a night — dinner, then something to do.</p>
        <div class="actions">
          <a class="btn" href="#reel">Start scrolling</a>
        </div>
      </div>
    </section>

    <div id="reel" class="reel" aria-label="Neighborhood reel"></div>
    <section id="corridor" class="corridor" hidden aria-live="polite"></section>
  </main>

  <footer class="foot">
    <p>Living nights · nightoutchicago.com</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
