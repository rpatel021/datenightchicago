<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DateNight Chicago</title>
  <meta name="description" content="One corridor. Eat → Then → Backup → Transit → Don’t." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="desk" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <span class="wordmark">DateNight</span>
      <span class="chip sun">Chicago</span>
    </div>
    <p class="promise">Eat → Then → Backup → Transit → Don’t</p>
  </header>

  <section class="calendar-bar" aria-label="Pick a night">
    <div class="cal-label">Nights</div>
    <div class="cal-track" id="cal-track" role="tablist"></div>
    <div class="cal-slider" aria-hidden="true">
      <input id="cal-range" type="range" min="0" max="5" value="0" step="1" />
    </div>
  </section>

  <main id="stage"></main>

  <footer class="foot">
    <p>Living plans · <code>plans.json</code></p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
