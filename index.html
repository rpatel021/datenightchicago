<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DateNight Chicago</title>
  <meta name="description" content="One corridor. Eat → Then → Backup → Transit → Don’t. Scroll by date." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="wordmark">DateNight</span>
      <span class="chip">Chicago</span>
    </div>
    <p class="legend" aria-hidden="true">Eat → Then → Backup → Transit → Don’t</p>
    <a class="cta" id="cta-tonight" href="#chapters">See tonight’s plan</a>
  </header>

  <nav class="rail" id="date-rail" aria-label="Jump to a night"></nav>

  <main id="chapters" class="chapters" tabindex="-1"></main>

  <footer class="foot">
    <p>Living plans — update <code>plans.json</code>, redeploy. Optional <code>eat.image</code> / <code>then.image</code>.</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
